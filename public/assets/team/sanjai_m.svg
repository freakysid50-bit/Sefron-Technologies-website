<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCFO" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061A1C" />
      <stop offset="60%" stop-color="#0F2E30" />
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.35" />
    </linearGradient>
    <linearGradient id="skinGradCFO" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8BA95" />
      <stop offset="100%" stop-color="#CB8D5E" />
    </linearGradient>
    <linearGradient id="suitGradCFO" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1C1E" />
      <stop offset="100%" stop-color="#142B2E" />
    </linearGradient>
    <linearGradient id="hairGradCFO" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1F22" />
      <stop offset="100%" stop-color="#0D0E10" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="480" fill="url(#bgGradCFO)" />
  <circle cx="200" cy="180" r="140" fill="#14B8A6" opacity="0.08" />

  <!-- Shoulders & Corporate Finance Blazer -->
  <g>
    <path d="M 50 480 L 110 320 C 135 295 160 290 200 290 C 240 290 265 295 290 320 L 350 480 Z" fill="url(#suitGradCFO)" />
    <!-- Lapels -->
    <path d="M 110 320 L 165 480 L 195 480 L 175 320 Z" fill="#071416" />
    <path d="M 290 320 L 235 480 L 205 480 L 225 320 Z" fill="#0C1D20" />
    <!-- Lapel Accent Pin -->
    <circle cx="150" cy="355" r="3.5" fill="#14B8A6" />
    <!-- Shirt / Tie -->
    <polygon points="175,290 200,345 225,290 215,280 185,280" fill="#F8FAFC" />
    <!-- Teal Executive Tie -->
    <polygon points="196,290 204,290 207,380 200,410 193,380" fill="#0D9488" />
  </g>

  <!-- Neck -->
  <rect x="180" y="225" width="40" height="70" rx="8" fill="#CB8D5E" />
  <path d="M 180 250 Q 200 275 220 250 L 220 280 L 180 280 Z" fill="#A86838" opacity="0.4" />

  <!-- Head -->
  <ellipse cx="200" cy="190" rx="64" ry="79" fill="url(#skinGradCFO)" />

  <!-- Ears -->
  <ellipse cx="136" cy="195" rx="10" ry="18" fill="#CB8D5E" />
  <ellipse cx="264" cy="195" rx="10" ry="18" fill="#CB8D5E" />

  <!-- Sharp Executive Hairstyle -->
  <path d="M 134 170 C 134 100 165 96 200 96 C 238 96 266 102 266 170 C 266 180 258 152 248 142 C 235 130 165 130 152 142 C 142 152 134 180 134 170 Z" fill="url(#hairGradCFO)" />
  <path d="M 136 158 Q 200 112 264 158 Q 240 128 200 128 Q 160 128 136 158 Z" fill="#2D3035" opacity="0.4" />

  <!-- Eyebrows -->
  <path d="M 160 168 Q 175 162 190 166" stroke="#1A1B22" stroke-width="4.5" stroke-linecap="round" fill="none" />
  <path d="M 210 166 Q 225 162 240 168" stroke="#1A1B22" stroke-width="4.5" stroke-linecap="round" fill="none" />

  <!-- Eyes -->
  <ellipse cx="175" cy="182" rx="7" ry="5.5" fill="#1A1B22" />
  <ellipse cx="225" cy="182" rx="7" ry="5.5" fill="#1A1B22" />
  <circle cx="177" cy="180" r="2" fill="#FFFFFF" />
  <circle cx="227" cy="180" r="2" fill="#FFFFFF" />

  <!-- Nose -->
  <path d="M 200 183 L 196 210 L 204 210" stroke="#A86838" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Mustache / Groomed Jaw -->
  <path d="M 188 222 Q 200 220 212 222" stroke="#1A1B22" stroke-width="2.5" fill="none" />
  <path d="M 176 220 C 176 254 224 254 224 220 C 220 240 180 240 176 220 Z" fill="#1A1B22" opacity="0.75" />

  <!-- Smile -->
  <path d="M 186 230 Q 200 240 214 230" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- CFO Badge Top Left -->
  <g transform="translate(20, 20)">
    <rect width="90" height="26" rx="13" fill="rgba(20, 184, 166, 0.18)" stroke="rgba(20, 184, 166, 0.45)" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#14B8A6" />
    <text x="25" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#2DD4BF" letter-spacing="1">CFO</text>
  </g>
</svg>
