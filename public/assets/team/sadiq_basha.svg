<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCCO" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0B1F" />
      <stop offset="60%" stop-color="#191535" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.35" />
    </linearGradient>
    <linearGradient id="skinGradCCO" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2C5A2" />
      <stop offset="100%" stop-color="#D9976E" />
    </linearGradient>
    <linearGradient id="suitGradCCO" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121324" />
      <stop offset="100%" stop-color="#1E2038" />
    </linearGradient>
    <linearGradient id="hairGradCCO" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1829" />
      <stop offset="100%" stop-color="#0D0B14" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="480" fill="url(#bgGradCCO)" />
  <circle cx="200" cy="180" r="140" fill="#818CF8" opacity="0.1" />

  <!-- Shoulders & Designer Tech Outfit -->
  <g>
    <path d="M 50 480 L 110 320 C 135 295 160 290 200 290 C 240 290 265 295 290 320 L 350 480 Z" fill="url(#suitGradCCO)" />
    <!-- Modern Creative Collar & Accents -->
    <path d="M 160 290 Q 200 340 240 290" stroke="#818CF8" stroke-width="3.5" fill="none" />
    <polygon points="180,290 200,335 220,290" fill="#2E284D" />
  </g>

  <!-- Neck -->
  <rect x="180" y="225" width="40" height="70" rx="8" fill="#D9976E" />
  <path d="M 180 250 Q 200 275 220 250 L 220 280 L 180 280 Z" fill="#B3734B" opacity="0.35" />

  <!-- Head -->
  <ellipse cx="200" cy="190" rx="63" ry="78" fill="url(#skinGradCCO)" />

  <!-- Ears -->
  <ellipse cx="137" cy="195" rx="10" ry="18" fill="#D9976E" />
  <ellipse cx="263" cy="195" rx="10" ry="18" fill="#D9976E" />

  <!-- Stylish Modern Creative Haircut -->
  <path d="M 132 170 C 132 95 165 92 205 92 C 245 92 270 102 270 165 C 270 180 260 150 245 140 C 230 130 165 130 150 142 C 140 152 132 180 132 170 Z" fill="url(#hairGradCCO)" />
  <path d="M 135 155 Q 200 110 265 155 Q 235 125 200 125 Q 165 125 135 155 Z" fill="#36304D" opacity="0.4" />

  <!-- Eyebrows -->
  <path d="M 160 168 Q 175 162 190 166" stroke="#1A1824" stroke-width="4.5" stroke-linecap="round" fill="none" />
  <path d="M 210 166 Q 225 162 240 168" stroke="#1A1824" stroke-width="4.5" stroke-linecap="round" fill="none" />

  <!-- Eyes -->
  <ellipse cx="175" cy="182" rx="7" ry="5.5" fill="#1A1824" />
  <ellipse cx="225" cy="182" rx="7" ry="5.5" fill="#1A1824" />
  <circle cx="177" cy="180" r="2" fill="#FFFFFF" />
  <circle cx="227" cy="180" r="2" fill="#FFFFFF" />

  <!-- Nose -->
  <path d="M 200 183 L 196 210 L 204 210" stroke="#B3734B" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Well Groomed Creative Designer Beard / Goatee -->
  <path d="M 188 222 Q 200 220 212 222" stroke="#1A1824" stroke-width="2.5" fill="none" />
  <path d="M 175 220 C 175 255 225 255 225 220 C 220 242 180 242 175 220 Z" fill="#1A1824" opacity="0.8" />

  <!-- Warm Smile -->
  <path d="M 186 230 Q 200 240 214 230" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- CCO Badge Top Left -->
  <g transform="translate(20, 20)">
    <rect width="90" height="26" rx="13" fill="rgba(129, 140, 248, 0.18)" stroke="rgba(129, 140, 248, 0.45)" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#818CF8" />
    <text x="25" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#A5B4FC" letter-spacing="1">CCO</text>
  </g>
</svg>
