<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCTO" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D1E" />
      <stop offset="60%" stop-color="#141E33" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.35" />
    </linearGradient>
    <linearGradient id="skinGradCTO" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8B58D" />
      <stop offset="100%" stop-color="#CA8A58" />
    </linearGradient>
    <linearGradient id="suitGradCTO" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#1C2541" />
    </linearGradient>
    <linearGradient id="hairGradCTO" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181820" />
      <stop offset="100%" stop-color="#0A0B10" />
    </linearGradient>
    <linearGradient id="cyanAccentCTO" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0077CC" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="480" fill="url(#bgGradCTO)" />
  <circle cx="200" cy="180" r="140" fill="#00A3FF" opacity="0.08" />

  <!-- Shoulders & Tech Executive Blazer -->
  <g>
    <path d="M 50 480 L 110 320 C 135 295 160 290 200 290 C 240 290 265 295 290 320 L 350 480 Z" fill="url(#suitGradCTO)" />
    <!-- Lapels -->
    <path d="M 110 320 L 165 480 L 195 480 L 175 320 Z" fill="#0D1322" />
    <path d="M 290 320 L 235 480 L 205 480 L 225 320 Z" fill="#131B2E" />
    <!-- Lapel Accent Pin -->
    <circle cx="150" cy="355" r="3.5" fill="#00D2FF" />
    <!-- Shirt / Collar (Tech Blue Shirt) -->
    <polygon points="175,290 200,345 225,290 215,280 185,280" fill="#0284C7" />
    <polygon points="200,345 190,480 210,480" fill="#0369A1" />
  </g>

  <!-- Neck -->
  <rect x="180" y="225" width="40" height="70" rx="8" fill="#CA8A58" />
  <path d="M 180 250 Q 200 275 220 250 L 220 280 L 180 280 Z" fill="#A86838" opacity="0.4" />

  <!-- Head -->
  <ellipse cx="200" cy="190" rx="64" ry="79" fill="url(#skinGradCTO)" />

  <!-- Ears -->
  <ellipse cx="136" cy="195" rx="10" ry="18" fill="#CA8A58" />
  <ellipse cx="264" cy="195" rx="10" ry="18" fill="#CA8A58" />

  <!-- Hair (Sharp Short Tech Cut) -->
  <path d="M 134 170 C 134 105 165 100 200 100 C 236 100 266 105 266 170 C 266 180 258 155 248 145 C 235 132 165 132 152 145 C 142 155 134 180 134 170 Z" fill="url(#hairGradCTO)" />
  <path d="M 136 160 Q 200 115 264 160 Q 240 130 200 130 Q 160 130 136 160 Z" fill="#2D303E" opacity="0.4" />

  <!-- Eyebrows -->
  <path d="M 160 168 Q 175 162 190 166" stroke="#1A1B22" stroke-width="4.5" stroke-linecap="round" fill="none" />
  <path d="M 210 166 Q 225 162 240 168" stroke="#1A1B22" stroke-width="4.5" stroke-linecap="round" fill="none" />

  <!-- Eyes & Smart Glasses -->
  <ellipse cx="175" cy="180" rx="7" ry="5.5" fill="#1A1B22" />
  <ellipse cx="225" cy="180" rx="7" ry="5.5" fill="#1A1B22" />
  <circle cx="177" cy="178" r="2" fill="#FFFFFF" />
  <circle cx="227" cy="178" r="2" fill="#FFFFFF" />

  <!-- Sleek Modern Tech Glasses -->
  <rect x="156" y="170" width="38" height="24" rx="6" stroke="#00D2FF" stroke-width="2.5" fill="rgba(0,210,255,0.08)" />
  <rect x="206" y="170" width="38" height="24" rx="6" stroke="#00D2FF" stroke-width="2.5" fill="rgba(0,210,255,0.08)" />
  <line x1="194" y1="180" x2="206" y2="180" stroke="#00D2FF" stroke-width="2.5" />

  <!-- Nose -->
  <path d="M 200 183 L 196 210 L 204 210" stroke="#A86838" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Groomed Beard / Trim -->
  <path d="M 174 220 C 174 255 226 255 226 220 C 220 242 180 242 174 220 Z" fill="#1A1B22" opacity="0.8" />

  <!-- Confident Smile -->
  <path d="M 186 230 Q 200 240 214 230" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Executive Badge Top Left -->
  <g transform="translate(20, 20)">
    <rect width="90" height="26" rx="13" fill="rgba(0, 210, 255, 0.15)" stroke="rgba(0, 210, 255, 0.4)" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#00D2FF" />
    <text x="25" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#38BDF8" letter-spacing="1">CTO</text>
  </g>
</svg>
